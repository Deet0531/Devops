# Port can be overridden by env var SERVER_PORT (ConfigMap in Kubernetes)
server.port=${SERVER_PORT:8080}
app.message=${APP_MESSAGE:Hello from Todo API v1 (hello feature)}

# Health endpoint + liveness/readiness probe groups
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
